name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish to crates.io, for example v0.5.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            format: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            format: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            format: zip
          - target: aarch64-apple-darwin
            os: macos-15
            format: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            format: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build the asset
        shell: bash
        run: >-
          packaging/build-release-asset.sh
          --target "${{ matrix.target }}"
          --format "${{ matrix.format }}"
          --out dist
          "${{ github.ref_name }}"
      - name: Smoke test the archive
        shell: bash
        env:
          FORMAT: ${{ matrix.format }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          if [ "$FORMAT" = "zip" ]; then
            unzip -q dist/*.zip -d "$RUNNER_TEMP/smoke"
          else
            tar -C "$RUNNER_TEMP/smoke" -xzf dist/*.tar.gz
          fi
          bin="$RUNNER_TEMP/smoke/lyrachi"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          out="$("$bin" --version)"
          echo "$out"
          case "$out" in
            *"${VERSION#v}"*) ;;
            *) echo "::error::unexpected --version output"; exit 1 ;;
          esac
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c ./*.sha256)
          else
            (cd dist && shasum -a 256 -c ./*.sha256)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lyrachi-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    name: draft the GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$TAG" \
              --generate-notes
          fi

  publish-crates:
    if: github.event_name == 'workflow_dispatch'
    name: publish crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Verify the tag matches the crate version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(awk '/^\[package\]/{inside=1} inside && /^version = /{print; exit}' Cargo.toml | cut -d'"' -f2)"
          if [ -z "$version" ] || [ "$version" != "${INPUT_TAG#v}" ]; then
            echo "::error::Cargo.toml version ($version) does not match $INPUT_TAG"
            exit 1
          fi
      - name: Dry run
        run: cargo publish --locked --dry-run
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
