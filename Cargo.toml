[package]
name = "lyrachi"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Synchronized terminal lyrics for active media players"

[dependencies]
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "net"] }
tokio-util = "0.7.20"
futures-util = "0.3"
zbus = { version = "6.3.0", default-features = false, features = ["tokio", "proxy"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.1.1"
clap = { version = "4.6.7", features = ["derive"] }
strsim = "0.11.1"
regex = "1.13.1"
unicode-segmentation = "1.12"
unicode-width = "0.2.3"
thiserror = "2"
color-eyre = "0.6.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6.0.0"
toml = "1.2.1"
toml_edit = "0.25.19"
blake3 = "1.8.7"
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["test-util"] }
insta = "1.49.0"

[profile.dev]
debug = 1

[profile.test]
debug = 1
